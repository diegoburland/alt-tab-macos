# Internal self-build of AltTab (GPL-3.0) with Pro unlocked. Not notarized: signed with a self-signed
# certificate stored in the repo secrets, so TCC permissions survive rebuilds.
name: internal-build
on:
  workflow_dispatch:
  push:
    branches: [internal-pro]
permissions:
  contents: write
env:
  BUILD_DIR: ${{ github.workspace }}
  XCODE_BUILD_PATH: DerivedData/Build/Products/Release
  APP_NAME: AltTab
jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
      - name: Resolve version from the latest upstream tag
        run: |
          v=$(git describe --tags --abbrev=0 --match 'v*' | sed 's/^v//')
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "version=$v"
      - name: Write local.xcconfig (version, no AppCenter, self-signed identity)
        run: |
          cat > config/local.xcconfig <<EOF
          CURRENT_PROJECT_VERSION = $VERSION
          APPCENTER_SECRET =
          CODE_SIGN_IDENTITY = Local Self-Signed
          OTHER_CODE_SIGN_FLAGS = --timestamp=none --deep --options runtime
          EOF
          cat config/local.xcconfig
      - name: Import self-signed certificate
        env:
          INTERNAL_P12: ${{ secrets.INTERNAL_P12 }}
          INTERNAL_P12_PASSWORD: ${{ secrets.INTERNAL_P12_PASSWORD }}
        run: |
          echo "$INTERNAL_P12" | base64 --decode > codesign.p12
          scripts/codesign/import_certificate_into_new_keychain.sh codesign "$INTERNAL_P12_PASSWORD"
          security find-identity -v -p codesigning
      - run: scripts/build_app.sh
      - name: Verify signature and package
        run: |
          app="$XCODE_BUILD_PATH/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - "$app" 2>&1 | head -20
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist"
          ditto -c -k --keepParent "$app" "AltTab-internal-$VERSION.zip"
          ls -la AltTab-internal-$VERSION.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AltTab-internal-${{ env.VERSION }}
          path: AltTab-internal-${{ env.VERSION }}.zip
          if-no-files-found: error
      - name: Publish as GitHub release on this fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="internal-$VERSION-r${{ github.run_number }}"
          gh release create "$tag" "AltTab-internal-$VERSION.zip" \
            --title "AltTab internal $VERSION (Pro unlocked, self-signed)" \
            --notes "Self-build of upstream v$VERSION under GPL-3.0 with Pro permanently unlocked and the Sparkle feed disabled. Not notarized: run \`xattr -dr com.apple.quarantine AltTab.app\` after unzipping."
